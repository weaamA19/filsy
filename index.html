<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Filsy | Smart Money Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Filsy</h1>
    <p>Upload your receipt and let AI do the rest!</p>

    <input type="file" id="receiptInput" accept="image/*">
    <button id="analyzeBtn">Submit</button>

    <button id="analyzeBtn">Submit</button>

    <div class="category-grid">
      <div class="category-box"><span>T</span> Tourism</div>
      <div class="category-box"><span>A</span> Accommodation</div>
      <div class="category-box"><span>P</span> Public Transport</div>
      <div class="category-box"><span>S</span> E-SIM</div>
      <div class="category-box"><span>G</span> Grocery</div>
      <div class="category-box"><span>E</span> Essentials</div>
    </div>

    <div id="output">
      <p id="loading"></p>
      <pre id="result"></pre>
    </div>
  </div>

  <!-- Review & Confirm Modal -->
  <div id="reviewModal" class="modal">
    <div class="modal-content">
      <span id="closeModal" class="close">&times;</span>
      <h2>Review Recognized Text</h2>
      <textarea id="modalText" rows="10" readonly></textarea>
      <div class="modal-buttons">
        <button id="confirmBtn">Confirm</button>
        <button id="editBtn" class="secondary">Edit</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
